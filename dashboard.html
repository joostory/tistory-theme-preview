<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tistory Theme Live Preview Suite</title>
  <!-- Google Fonts Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0c10 0%, #15171e 50%, #0b0c10 100%);
      --panel-bg: rgba(21, 23, 30, 0.72);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ff5638; /* Tistory Signature Coral */
      --accent-glow: rgba(255, 86, 56, 0.35);
      --accent-hover: #ff6f54;
      --active-bg: rgba(255, 86, 56, 0.12);
      --input-bg: rgba(30, 34, 45, 0.85);
      --card-radius: 14px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Left Sidebar */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      z-index: 10;
      box-shadow: 12px 0 35px rgba(0, 0, 0, 0.4);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ff5638, #ff8469);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .logo-text h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.4px;
      background: linear-gradient(to right, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text span {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .sidebar-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    .control-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--card-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-section h3 {
      font-size: 11px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
      margin-bottom: 2px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .btn-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .view-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
    }

    .view-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .view-btn.active {
      background: var(--active-bg);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(255, 86, 56, 0.2);
    }

    /* Device viewport buttons */
    .device-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .device-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .device-btn.active {
      background: var(--active-bg);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    /* Dynamic Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-input, .form-select {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    .color-hex {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .action-btn.primary:hover {
      background: var(--accent-hover);
    }

    /* Main Preview Stage */
    .preview-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #090a0f;
    }

    .preview-topbar {
      height: 48px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .url-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-width: 480px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewport-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .resolution-pill {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #e2e8f0;
    }

    .preview-viewport-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      position: relative;
    }

    .preview-frame-container {
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      width: 100%;
    }

    .preview-frame-container.device-mobile {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      border: 8px solid #2d3139;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
    }

    .preview-frame-container.device-mobile.landscape {
      width: 844px;
      height: 390px;
    }

    .preview-frame-container.device-tablet {
      width: 768px;
      height: 1024px;
      border-radius: 24px;
      border: 8px solid #2d3139;
    }

    .preview-frame-container.device-tablet.landscape {
      width: 1024px;
      height: 768px;
    }

    .preview-frame-container.device-laptop {
      width: 1280px;
      height: 800px;
      border-radius: 12px;
      border: 4px solid #2d3139;
    }

    .preview-frame-container.device-desktop {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Panel -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-badge">T</div>
        <div class="logo-text">
          <h2>Tistory Preview</h2>
          <span>Live DevSuite</span>
        </div>
      </div>
      <div class="live-status" title="실시간 파일 변경 감지 가동 중">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <div class="sidebar-scroll">

      <!-- View Type Selector -->
      <section class="control-section">
        <h3>뷰 모드 (View Type)</h3>
        <div class="btn-grid">
          <button class="view-btn active" data-view="index">
            <span>🏠</span> 홈 (인덱스)
          </button>
          <button class="view-btn" data-view="permalink">
            <span>📄</span> 글 본문
          </button>
          <button class="view-btn" data-view="category">
            <span>📋</span> 카테고리 목록
          </button>
          <button class="view-btn" data-view="search">
            <span>🔍</span> 검색 결과
          </button>
          <button class="view-btn" data-view="tag">
            <span>🏷️</span> 태그 클라우드
          </button>
          <button class="view-btn" data-view="notice">
            <span>📢</span> 공지사항
          </button>
          <button class="view-btn" data-view="protected">
            <span>🔒</span> 보호글
          </button>
          <button class="view-btn" data-view="page">
            <span>📑</span> 독립 페이지
          </button>
          <button class="view-btn" data-view="guestbook">
            <span>📖</span> 방명록
          </button>
          <button class="view-btn" data-view="empty-search">
            <span>🚫</span> 검색결과 없음
          </button>
        </div>
      </section>

      <!-- Viewport Device Switcher -->
      <section class="control-section">
        <h3>반응형 뷰포트 (Viewport)</h3>
        <div class="btn-grid-3">
          <button class="device-btn active" data-device="desktop">Desktop</button>
          <button class="device-btn" data-device="laptop">1280px</button>
          <button class="device-btn" data-device="tablet">Tablet</button>
          <button class="device-btn" data-device="mobile">Mobile</button>
          <button class="device-btn" id="btn-rotate">회전 🔄</button>
          <button class="device-btn" id="btn-open-tab" title="새 탭에서 전체 화면으로 열기">새 탭 ↗</button>
        </div>
      </section>

      <!-- Skin Options (Dynamically populated from index.xml) -->
      <section class="control-section">
        <h3>스킨 옵션 (Skin Options)</h3>

        <!-- Home Cover Toggle -->
        <div class="form-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
          <span class="form-label" style="margin: 0;">홈 커버 표시 (s_cover)</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-cover" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div id="dynamic-variables-container" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Dynamically inserted controls from /api/skin-info -->
          <div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 6px 0;">
            스킨 설정 불러오는 중...
          </div>
        </div>
      </section>

      <!-- Actions -->
      <section class="control-section">
        <h3>프리뷰 제어</h3>
        <div style="display: flex; gap: 8px;">
          <button class="action-btn primary" id="btn-refresh" style="flex: 1;">
            <span>🔄</span> 새로고침
          </button>
          <button class="action-btn" id="btn-reset" style="flex: 1;">
            <span>⏮️</span> 옵션 초기화
          </button>
        </div>
      </section>

    </div>
  </aside>

  <!-- Right Preview Canvas -->
  <main class="preview-stage">
    <div class="preview-topbar">
      <div class="url-bar">
        <span style="color: #64748b;">http://localhost:3000</span><span id="current-query" style="color: #e2e8f0;">/render?viewType=index</span>
      </div>
      <div class="viewport-meta">
        <span id="current-view-badge" style="color: var(--accent); font-weight: 600;">홈 화면</span>
        <span class="resolution-pill" id="resolution-indicator">100% Fullscreen</span>
      </div>
    </div>

    <div class="preview-viewport-wrapper">
      <div class="preview-frame-container device-desktop" id="frame-container">
        <iframe id="preview-iframe" src="/render?viewType=index"></iframe>
      </div>
    </div>
  </main>

  <script>
    // State management
    const state = {
      viewType: 'index',
      device: 'desktop',
      isLandscape: false,
      enableCovers: true,
      variables: {},
      searchQuery: 'CSS',
      category: '웹 개발',
      tag: 'React'
    };

    const frameContainer = document.getElementById('frame-container');
    const previewIframe = document.getElementById('preview-iframe');
    const currentQueryDisplay = document.getElementById('current-query');
    const resolutionIndicator = document.getElementById('resolution-indicator');
    const currentViewBadge = document.getElementById('current-view-badge');
    const dynamicVarsContainer = document.getElementById('dynamic-variables-container');
    const toggleCover = document.getElementById('toggle-cover');

    // Build URL from state
    function buildRenderUrl() {
      const params = new URLSearchParams();

      if (state.viewType === 'empty-search') {
        params.set('viewType', 'search');
        params.set('q', '존재하지않는검색어결과_None');
      } else {
        params.set('viewType', state.viewType);
        if (state.viewType === 'search') params.set('q', state.searchQuery);
        if (state.viewType === 'category') params.set('category', state.category);
        if (state.viewType === 'tag') params.set('tag', state.tag);
      }

      params.set('enableCovers', state.enableCovers ? 'true' : 'false');

      // Append custom skin variables
      Object.keys(state.variables).forEach(k => {
        if (state.variables[k] !== undefined && state.variables[k] !== null) {
          params.set(k, state.variables[k]);
        }
      });

      return '/render?' + params.toString();
    }

    // Refresh preview iframe
    function updatePreview() {
      const url = buildRenderUrl();
      currentQueryDisplay.textContent = url;
      previewIframe.src = url;
    }

    // View type buttons
    const viewButtons = document.querySelectorAll('.view-btn');
    viewButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        viewButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.viewType = btn.dataset.view;

        const viewNames = {
          index: '홈 (인덱스/커버)',
          permalink: '글 본문 상세',
          category: '카테고리 글 목록',
          search: '검색 결과',
          tag: '태그 클라우드',
          notice: '공지사항',
          protected: '보호글',
          page: '독립 페이지',
          guestbook: '방명록',
          'empty-search': '검색 결과 없음'
        };
        currentViewBadge.textContent = viewNames[state.viewType] || state.viewType;
        updatePreview();
      });
    });

    // Device viewport switching
    const deviceButtons = document.querySelectorAll('.device-btn[data-device]');
    deviceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        deviceButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.device = btn.dataset.device;
        applyViewport();
      });
    });

    function applyViewport() {
      frameContainer.className = 'preview-frame-container device-' + state.device;
      if (state.isLandscape && (state.device === 'mobile' || state.device === 'tablet')) {
        frameContainer.classList.add('landscape');
      }

      const resMap = {
        desktop: '100% Fullscreen',
        laptop: '1280 × 800',
        tablet: state.isLandscape ? '1024 × 768' : '768 × 1024',
        mobile: state.isLandscape ? '844 × 390' : '390 × 844'
      };
      resolutionIndicator.textContent = resMap[state.device] || state.device;
    }

    // Rotate orientation
    document.getElementById('btn-rotate').addEventListener('click', () => {
      state.isLandscape = !state.isLandscape;
      applyViewport();
    });

    // Open in new tab
    document.getElementById('btn-open-tab').addEventListener('click', () => {
      window.open(buildRenderUrl(), '_blank');
    });

    // Refresh button
    document.getElementById('btn-refresh').addEventListener('click', () => {
      previewIframe.contentWindow.location.reload();
    });

    // Cover toggle
    toggleCover.addEventListener('change', (e) => {
      state.enableCovers = e.target.checked;
      updatePreview();
    });

    // Reset button
    document.getElementById('btn-reset').addEventListener('click', () => {
      state.variables = {};
      loadSkinInfo();
      updatePreview();
    });

    // Load skin info from index.xml
    async function loadSkinInfo() {
      try {
        const res = await fetch('/api/skin-info');
        const json = await res.json();
        dynamicVarsContainer.innerHTML = '';

        if (json.hasIndexXml && json.data.variables && json.data.variables.length > 0) {
          json.data.variables.forEach(v => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'form-group';

            if (state.variables[v.name] === undefined && v.default !== undefined) {
              state.variables[v.name] = v.default;
            }

            if (v.type === 'COLOR') {
              const val = state.variables[v.name] || v.default || '#ff5638';
              groupDiv.innerHTML = `
                <div class="form-label">
                  <span>${v.label || v.name}</span>
                  <span class="color-hex" id="hex-${v.name}">${val}</span>
                </div>
                <div class="color-row">
                  <input type="color" class="color-picker" id="input-${v.name}" value="${val}">
                  <span style="font-size:11px;color:#94a3b8;">[##_var_${v.name}_##]</span>
                </div>
              `;
              dynamicVarsContainer.appendChild(groupDiv);

              const colorInput = groupDiv.querySelector(`#input-${v.name}`);
              const hexDisplay = groupDiv.querySelector(`#hex-${v.name}`);
              colorInput.addEventListener('input', (e) => {
                hexDisplay.textContent = e.target.value;
                state.variables[v.name] = e.target.value;
                updatePreview();
              });

            } else if (v.type === 'BOOL') {
              const isChecked = state.variables[v.name] === 'true' || state.variables[v.name] === true || v.default === 'true';
              groupDiv.style.flexDirection = 'row';
              groupDiv.style.justifyContent = 'space-between';
              groupDiv.style.alignItems = 'center';
              groupDiv.innerHTML = `
                <div>
                  <div class="form-label" style="margin:0;">${v.label || v.name}</div>
                  <div style="font-size:10px;color:#94a3b8;">s_if_var_${v.name}</div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="input-${v.name}" ${isChecked ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              `;
              dynamicVarsContainer.appendChild(groupDiv);

              const checkInput = groupDiv.querySelector(`#input-${v.name}`);
              checkInput.addEventListener('change', (e) => {
                state.variables[v.name] = e.target.checked ? 'true' : 'false';
                updatePreview();
              });

            } else if (v.type === 'SELECT') {
              let optionsHtml = '';
              if (v.options && Array.isArray(v.options)) {
                v.options.forEach(opt => {
                  const selected = (state.variables[v.name] === opt.value || v.default === opt.value) ? 'selected' : '';
                  optionsHtml += `<option value="${opt.value}" ${selected}>${opt.label || opt.name}</option>`;
                });
              }

              groupDiv.innerHTML = `
                <div class="form-label">${v.label || v.name}</div>
                <select class="form-select" id="input-${v.name}">
                  ${optionsHtml}
                </select>
              `;
              dynamicVarsContainer.appendChild(groupDiv);

              const selInput = groupDiv.querySelector(`#input-${v.name}`);
              selInput.addEventListener('change', (e) => {
                state.variables[v.name] = e.target.value;
                updatePreview();
              });

            } else {
              // STRING or IMAGE
              const val = state.variables[v.name] || v.default || '';
              groupDiv.innerHTML = `
                <div class="form-label">${v.label || v.name}</div>
                <input type="text" class="form-input" id="input-${v.name}" value="${val}" placeholder="${v.description || ''}">
              `;
              dynamicVarsContainer.appendChild(groupDiv);

              const txtInput = groupDiv.querySelector(`#input-${v.name}`);
              txtInput.addEventListener('change', (e) => {
                state.variables[v.name] = e.target.value;
                updatePreview();
              });
            }
          });
        } else {
          dynamicVarsContainer.innerHTML = `
            <div style="font-size: 11px; color: #64748b; line-height: 1.5; padding: 4px 0;">
              index.xml에 정의된 커스텀 변수가 없습니다. 테마의 index.xml에 <code>&lt;variables&gt;</code>를 추가하면 실시간 조작 컨트롤러가 자동 생성됩니다.
            </div>
          `;
        }
      } catch (e) {
        dynamicVarsContainer.innerHTML = '<div style="font-size:11px;color:#ef4444;">설정 로드 실패</div>';
      }
    }

    // Initialize
    loadSkinInfo();
  </script>
</body>
</html>
